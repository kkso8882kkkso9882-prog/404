<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>404 Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FF5A1F; --ink:#10163F; --ibg:#2D3DFF; --iink:#FFE14D;
  --c1:#FFE14D; --c2:#FF3D8B; --c3:#18E0A5; --c4:#FFFFFF;
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#2D3DFF;--ink:#FFE14D;--ibg:#FF5A1F;--iink:#10163F;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#2D3DFF;--ink:#FFE14D;--ibg:#FF5A1F;--iink:#10163F;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;overflow-x:clip}
.bar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:5px;background:#fff;transform:scaleX(0);transform-origin:0 50%;z-index:30;mix-blend-mode:difference}
.cur{position:fixed;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:80;display:none;will-change:transform}
@media (pointer:fine){.cur{display:block}}

.top{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;row-gap:20px;padding:clamp(28px,5vw,64px) clamp(20px,4vw,56px) 0}
h1{grid-column:1 / span 7;margin:0;font-size:clamp(34px,5.4vw,72px);font-weight:800;line-height:1.02;letter-spacing:-.03em}
.note{grid-column:9 / span 4;margin:0;font-size:clamp(15px,1.25vw,18px);max-width:34ch;font-weight:500;animation:up .9s .5s cubic-bezier(.16,1,.3,1) both}
.note .path{display:block;margin-top:14px;padding-top:10px;border-top:3px solid currentColor;font-weight:700;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font:700 15px var(--font);padding:12px 20px;border-radius:99px;border:3px solid var(--ink);background:var(--ink);color:var(--bg);text-decoration:none;cursor:pointer;transition:transform .2s cubic-bezier(.16,1,.3,1),background .2s,color .2s}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{transform:translateY(-3px) rotate(-2deg);background:var(--bg);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hw{display:inline-block;animation:up .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes up{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hw,.note{animation:none}.btn{transition:none}}
.js .top:not(.in) .hw,.js .top:not(.in) .note{animation:none;opacity:0}
.hint{position:absolute;left:0;right:0;bottom:calc(2.2svh + env(safe-area-inset-bottom,0px));margin:0;text-align:center;font-weight:600;font-size:14px;opacity:0;pointer-events:none}

.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:50;display:flex;align-items:center;gap:8px;font:600 13px var(--font);padding:9px 14px 9px 11px;border-radius:99px;border:2px solid var(--ink);background:var(--bg);color:var(--ink);cursor:pointer}
.snd .x{display:none}.snd.off .w{display:none}.snd.off .x{display:block}
.snd:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* story: ball → stairs → dominoes → letters */
.story{height:100svh;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pin{position:relative;height:100svh;overflow:hidden}
.stage{position:absolute;inset:0;will-change:transform}
.rp,.fl{position:absolute;background:var(--ink);border-radius:99px;will-change:transform}
.rg{position:absolute;left:0;top:0;border:3px solid var(--c4);border-radius:50%;opacity:0;pointer-events:none;will-change:transform}
.ball{position:absolute;left:0;top:0;z-index:3;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#e9edff 55%,#aeb9ff);box-shadow:0 2px 6px rgba(16,22,63,.35);will-change:transform}
.ball i{position:absolute;top:9%;left:50%;width:10%;height:10%;margin-left:-5%;border-radius:50%;background:#10163F}
.dm{position:absolute;left:0;top:0;border-radius:4px;background:var(--dc);box-shadow:0 3px 0 rgba(16,22,63,.35);display:grid;place-items:center;will-change:transform}
.pp{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at 50% 27%,#10163F 0 1.6px,transparent 2.2px),radial-gradient(circle at 50% 73%,#10163F 0 1.6px,transparent 2.2px),linear-gradient(#10163F,#10163F) 0 50% / 100% 2px no-repeat}
.ch{position:relative;font-weight:900;font-stretch:62%;font-variation-settings:"wdth" 62;color:#10163F;line-height:1;opacity:0}
.spk{position:absolute;left:0;top:0;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;pointer-events:none;will-change:transform,opacity}

.inv{background:var(--ibg);color:var(--iink)}
.lamp{display:grid;justify-items:center;padding:0 20px 10vh;border-top:3px solid var(--iink)}
.lamp svg{width:min(200px,50vw);height:auto;overflow:visible;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.lamp p{margin:10px 0 0;font-weight:600;font-size:14px}
#bulb{fill:var(--ibg);stroke:currentColor;stroke-width:3;transition:fill .15s}
#glow{opacity:0;transition:opacity .15s}
.lit #bulb{fill:#fff}.lit #glow{opacity:.4}
#pg{cursor:grab;touch-action:none;outline:none}#pg:active{cursor:grabbing}
#pg:focus-visible .hd{stroke:currentColor;stroke-width:4}
.chaos{position:fixed;inset:0;z-index:60;display:none;overflow:hidden;transition:background .25s,color .25s}
.chaos.on{display:block}
.chaos{background:var(--b,#FF5A1F);color:var(--k,#10163F);transition:none}
.pops{position:absolute;inset:-70px;overflow:hidden;pointer-events:none;will-change:transform}
.crow,.bnc{font-weight:900;font-stretch:62%;font-variation-settings:"wdth" 62;line-height:1;white-space:nowrap}
.crow{position:absolute;left:0;display:flex;will-change:transform}
.crow span{padding-right:.5em}
.crow.o span{color:transparent;-webkit-text-stroke:2px currentColor}
.swp{position:absolute;left:0;top:0;display:flex;white-space:nowrap;background:var(--k);color:var(--b);font-weight:900;font-stretch:62%;font-variation-settings:"wdth" 62;line-height:1.1;will-change:transform}
.swp span{padding:0 .5em}
.bnc{position:absolute;left:0;top:0;padding:.08em .28em;border-radius:6px;background:var(--k);color:var(--b);will-change:transform}
.stopc.btn{position:absolute;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;background:#10163F;color:#fff;border-color:#fff}
.stopc.btn:hover{background:#fff;color:#10163F;transform:translateX(-50%)}
.scrub{padding:24vh clamp(20px,5vw,72px)}
.scrub p{margin:0 auto;max-width:20ch;font-size:clamp(32px,5.8vw,84px);font-weight:800;line-height:1.05;letter-spacing:-.03em}
.scrub .w{opacity:.2}
.marq{padding:4vh 0 14vh;overflow:hidden}
.row{display:flex;white-space:nowrap;will-change:transform;font-size:clamp(70px,15vw,220px);font-weight:900;font-stretch:62%;font-variation-settings:"wdth" 62;line-height:1}
.row span{padding-right:.4em;color:transparent;-webkit-text-stroke:2px var(--iink)}
.row span.f{color:var(--iink)}
.end{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;align-items:end;padding:6vh clamp(20px,4vw,56px) 8vh;border-top:3px solid var(--iink)}
.end b{grid-column:1 / span 7;font-size:clamp(40px,8vw,110px);font-weight:900;line-height:.95;letter-spacing:-.03em}
.end .path{grid-column:9 / span 4;font-size:clamp(15px,1.25vw,18px);font-weight:600;overflow-wrap:anywhere}
@media (max-width:760px){
  h1,.note,.end b,.end .path{grid-column:1 / -1}
  .end .path{margin-top:16px}
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="cur" id="cur"></div>
<button class="snd off" id="snd" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path class="w" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M17 9l5 6M22 9l-5 6"/></svg><span>Tap for sound</span></button>

<section class="story" id="story" role="img" aria-label="Error 404: a ball rolls down stairs and tips dominoes that spell ERROR 404. Click to replay.">
  <div class="pin" id="pin"><div class="stage" id="stage"></div><p class="hint" id="hint">Click to replay</p></div>
</section>

<section class="top">
  <h1>This page doesn’t exist.</h1>
  <div class="note">
    <p style="margin:0">It may have been moved or removed, or the address was typed incorrectly.</p>
    <span class="path">/</span>
    <div class="acts"><a class="btn" href="/">Go to homepage</a><button class="btn ghost" id="back" type="button">Go back</button></div>
  </div>
</section>

<section class="scrub inv">
  <p id="sp">Links break. Pages move. Addresses get retyped from memory. This one simply leads nowhere.</p>
</section>

<section class="marq inv" aria-hidden="true">
  <div class="row" id="r1"></div>
  <div class="row" id="r2"></div>
</section>

<section class="inv end">
  <b>Error 404</b>
  <span class="path">/</span>
</section>

<section class="inv lamp">
  <svg id="lamp" viewBox="0 0 200 260" role="group" aria-label="Lamp with a pull chain">
    <line x1="100" y1="0" x2="100" y2="60" stroke="currentColor" stroke-width="3"/>
    <line id="chain" x1="150" y1="130" x2="150" y2="196" stroke="currentColor" stroke-width="3" stroke-dasharray="1 5" stroke-linecap="round"/>
    <path d="M62 60h76l32 70H30z" fill="currentColor"/>
    <circle id="glow" cx="100" cy="146" r="48" fill="#fff"/>
    <circle id="bulb" cx="100" cy="138" r="13"/>
    <g id="pg" tabindex="0" role="button" aria-label="Pull the lamp chain">
      <circle cx="150" cy="196" r="28" fill="transparent"/>
      <circle class="hd" cx="150" cy="196" r="9" fill="currentColor"/>
    </g>
  </svg>
  <p>Pull the chain. Flashing visuals.</p>
</section>

<div class="chaos" id="chaos" aria-label="Error 404 everywhere">
  <div class="pops" id="pops" aria-hidden="true"></div>
  <button class="btn stopc" id="stopc" type="button">Turn it off</button>
</div>

<script>
(function(){
  document.documentElement.classList.add('js');
  var $=function(s){return document.querySelector(s)},clamp=function(v,a,b){return Math.min(b,Math.max(a,v))};
  var lerp=function(a,b,t){return a+(b-a)*t},eo=function(t){return 1-Math.pow(1-t,3)},eio=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var p;try{p=(location.pathname+location.search)||'/'}catch(e){p='/'}
  document.querySelectorAll('.path').forEach(function(e){e.textContent=p});
  $('#back').addEventListener('click',function(){
    var same=false;try{same=!!document.referrer&&new URL(document.referrer).origin===location.origin}catch(e){}
    if(same&&history.length>1){
      history.back();
      /* if the browser did not leave this page, go home */
      setTimeout(function(){if(!document.hidden)location.href='/'},600);
    }else location.href='/';
  });
  var h=$('h1');h.innerHTML=h.textContent.split(' ').map(function(w,i){return '<span class="hw" style="--i:'+i+'">'+w+'</span>'}).join(' ');
  var tx=-9999,ty=-9999,hover=false;
  addEventListener('pointermove',function(ev){tx=ev.clientX;ty=ev.clientY;hover=!!(ev.target.closest&&ev.target.closest('a,button'))},{passive:true});
  document.addEventListener('pointerleave',function(){tx=ty=-9999});

  /* ---------- sound (synthesised, no files) ---------- */
  var AC=null,master=null,noiseBuf=null,rollG=null,on=false,want=false,touched=false,quiet=true,lastF=0,cyc=-1,fired={},lastTick=0,ticked=false;
  var btn=$('#snd'),lab=btn.querySelector('span');
  function ui(){btn.setAttribute('aria-pressed',on?'true':'false');btn.classList.toggle('off',!on);lab.textContent=on?'Sound on':(touched?'Sound off':'Tap for sound')}
  function upd(){on=!!(AC&&want&&AC.state==='running');ui()}
  function aInit(){
    if(AC)return;var C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    AC=new C();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);
    var n=AC.sampleRate,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noiseBuf=b;
    var s=AC.createBufferSource();s.buffer=b;s.loop=true;var f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380;
    rollG=AC.createGain();rollG.gain.value=0;s.connect(f);f.connect(rollG);rollG.connect(master);s.start();
  }
  function setWant(v){want=v;if(v){aInit();if(AC&&AC.state!=='running')AC.resume().then(upd).catch(upd)}upd()}
  function unlock(ev){if(touched||btn.contains(ev.target))return;touched=true;setWant(true)}
  ['pointerdown','touchend','click','keydown'].forEach(function(n){addEventListener(n,unlock,{passive:true})});
  btn.addEventListener('click',function(){touched=true;setWant(!want)});
  function tone(f,d,ty,v,sl,dl){if(!on)return;var t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
  function click(f,d,v){if(!on)return;var t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;var fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=3;var g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,Math.random()*.4,d+.05)}
  function whoosh(){if(!on)return;var t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;var fl=AC.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(300,t);fl.frequency.exponentialRampToValueAtTime(3200,t+.9);var g=AC.createGain();g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.45,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+1);s.connect(fl);fl.connect(g);g.connect(master);s.start(t,0,1.1)}
  function rollSnd(v){if(rollG)rollG.gain.setTargetAtTime(on&&!quiet&&!reduce?v:0,AC.currentTime,.06)}
  function thud(k){tone(170+k*25,.22,'sine',.7,.45);click(500,.06,.5)}
  function hit(){tone(80,.4,'sine',1,.4);click(700,.12,.9)}
  function tock(i){click(1400+i*90,.07,.8);tone(300+i*20,.08,'triangle',.3,.7)}
  function tock2(i){click(900+i*50,.05,.45)}
  function flap(){click(2200+Math.random()*900,.03,.4)}
  function fin(){tone(440,.35,'sine',.35);tone(330,.7,'sine',.35,0,.16)}
  function fire(k,fn){if(fired[k]||reduce)return;fired[k]=1;if(!quiet&&on)fn()}

  /* ---------- sparks: little bursts when the ball lands ---------- */
  var sparks=[];
  function burst(x,y,n,col){
    if(reduce)return;
    for(var i=0;i<n;i++){var e=document.createElement('div');e.className='spk';e.style.background=col;stg.appendChild(e);
      var a=-Math.PI*(.15+Math.random()*.7),v=2+Math.random()*4;
      sparks.push({e:e,x:x,y:y,vx:Math.cos(a)*v*(Math.random()<.5?-1:1),vy:Math.sin(a)*v,l:1})}
  }
  function stepSparks(){
    for(var i=sparks.length-1;i>=0;i--){var s=sparks[i];s.vy+=.22;s.x+=s.vx;s.y+=s.vy;s.l-=.025;
      if(s.l<=0){s.e.remove();sparks.splice(i,1);continue}
      s.e.style.transform='translate('+s.x+'px,'+s.y+'px) scale('+s.l+')';s.e.style.opacity=s.l}
  }

  /* ---------- story ---------- */
  (function(){var tp=$('.top');if('IntersectionObserver' in window){new IntersectionObserver(function(en){if(en[0].isIntersecting)tp.classList.add('in')},{threshold:.3}).observe(tp)}else tp.classList.add('in')})();
  var N=9,R=4,TXT='ERROR 404',SEQ='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',L=SEQ.length,CYCLE=15000;
  var story=$('#story'),pin=$('#pin'),stg=$('#stage'),rps=[],rings=[],dms=[],g={},started=false,st0=0,tP=0;
  function add(c){var e=document.createElement('div');e.className=c;stg.appendChild(e);return e}
  for(var k=0;k<R;k++)rps.push(add('rp'));
  var fl=add('fl');
  for(k=0;k<=R;k++)rings.push(add('rg'));
  var ball=add('ball');ball.innerHTML='<i></i>';
  for(var i=0;i<N;i++){var e=add('dm');e.style.setProperty('--dc','var(--c'+(i%3+1)+')');e.innerHTML='<span class="pp"></span><span class="ch"></span>';dms.push({el:e,pp:e.firstChild,ch:e.lastChild,cur:'',k:0,t:0})}

  function layout(){
    var W=pin.clientWidth,H=pin.clientHeight;
    var D=Math.max(24,Math.min(W*.055,H*.055,44)),r=D/2,th=Math.max(6,Math.min(10,D*.28));
    var drop=.05*H,yf=H*.9,rp=[],segs=[],land=[],T=0,Rd=0;
    for(var k=0;k<R;k++){var yk=H*(.13+.145*k),ev=k%2===0;rp.push({xa:W*(ev?.06:.94),ya:yk,xb:W*(ev?.8:.2),yb:yk+drop})}
    var sy=function(k,x){var q=rp[k];return q.ya+(q.yb-q.ya)*(x-q.xa)/(q.xb-q.xa)-r-th/2};
    var sp=W*.058,w=Math.max(8,sp*.4),hh=Math.min(Math.max(sp*1.75,w*2.4),H*.2),x0=W*.34;
    function fall(x,y0,y1){var d=Math.sqrt(2*Math.abs(y1-y0)/1800);segs.push({t:'f',x0:x,y0:y0,x1:x,y1:y1,d:d,T0:T,R0:Rd});T+=d;land.push({x:x,y:y1+r,T:T})}
    function rl(xa,ya,xb,yb){var d=Math.abs(xb-xa)/520;segs.push({t:'r',x0:xa,y0:ya,x1:xb,y1:yb,d:d,T0:T,R0:Rd,dx:xb-xa});T+=d;Rd+=xb-xa}
    var sx=rp[0].xa+D,xl=sx;
    fall(sx,sy(0,sx)-H*.09,sy(0,sx));
    for(k=0;k<R;k++){
      var xb=rp[k].xb;rl(xl,sy(k,xl),xb,sy(k,xb));
      if(k<R-1){fall(xb,sy(k,xb),sy(k+1,xb));xl=xb}else{fall(xb,sy(k,xb),yf-r)}
    }
    rl(rp[R-1].xb,yf-r,x0-r,yf-r);
    g={W:W,H:H,D:D,r:r,th:th,segs:segs,land:land,T:T,x0:x0,yf:yf,sp:sp,w:w,h:hh,tw:W/N,tH:Math.min(H*.5,W/N*1.7),rp:rp};
    rp.forEach(function(q,k){
      var len=Math.hypot(q.xb-q.xa,q.yb-q.ya),el=rps[k],dx=Math.abs(q.xb-q.xa),a=Math.atan2(drop,dx)*57.2958*(k%2?-1:1);
      q.a=a;el.style.width=(len+th)+'px';el.style.height=th+'px';
      el.style.left=((q.xa+q.xb)/2-(len+th)/2)+'px';el.style.top=((q.ya+q.yb)/2-th/2)+'px';
    });
    fl.style.left='0';fl.style.width=W+'px';fl.style.top=yf+'px';fl.style.height=th+'px';
    ball.style.width=ball.style.height=D+'px';
    rings.forEach(function(e){e.style.width=e.style.height=(D*3)+'px'});
  }
  layout();

  var COLS=['#FFE14D','#FF3D8B','#18E0A5','#FFFFFF'];
  function story_(H,now){
    var rs=story.getBoundingClientRect();
    if(!started){started=true;st0=now+500}
    var dtt=now-st0,cy2=dtt<0?0:Math.floor(dtt/CYCLE),cm=dtt<0?0:dtt%CYCLE;
    tP=reduce?1:clamp(cm/11000,0,1);
    var pr=tP,vis=rs.bottom>0&&rs.top<H&&!document.hidden;
    quiet=!vis||now-lastF>200;lastF=now;
    if(cy2!==cyc){cyc=cy2;fired={};lastTick=0}
    stg.style.opacity=reduce?1:(cm<400?cm/400:(cm>14400?(CYCLE-cm)/600:1));
    var r=g.r,T=g.T;
    /* ball */
    var u=clamp(pr/.5,0,1),tt=u*T,s=g.segs,j=0;
    while(j<s.length-1&&tt>s[j].T0+s[j].d)j++;
    var sg=s[j],q=clamp((tt-sg.T0)/sg.d,0,1),f=sg.t==='f'?q*q:q;
    var bx=lerp(sg.x0,sg.x1,f),by=lerp(sg.y0,sg.y1,f);
    var rd=sg.R0+(sg.t==='r'?sg.dx*q:0),rot=rd/r*57.2958;
    var sq=0;
    g.land.forEach(function(l,k){
      var lq=clamp((u-l.T/T)/.05,0,1),act=u>=l.T/T-1e-6&&lq<1;
      var rg=rings[k];
      rg.style.opacity=act?(1-lq)*.9:0;
      rg.style.transform='translate('+(l.x-g.D*1.5)+'px,'+(l.y-g.D*1.5)+'px) scale('+(.2+lq*.9)+')';
      if(act)fire('l'+k,function(){thud(k)});
      if(act&&!fired['s'+k]&&vis&&!reduce){fired['s'+k]=1;burst(l.x,l.y,8,COLS[k%4])}
      var dip=act?6*Math.sin(Math.PI*lq)*(1-lq):0;
      if(k<R)rps[k].style.transform='rotate('+g.rp[k].a+'deg) translateY('+dip+'px)';
      if(act&&lq<.6)sq=Math.max(sq,.3*Math.sin(Math.PI*lq/.6));
    });
    rollSnd((sg.t==='r'&&pr<.5)?Math.min(.09,.03+Math.abs(sg.x1-sg.x0)/g.W*.1):0);
    if(pr>=.5)fire('hit',hit);
    var rec=10*Math.sin(Math.PI*clamp((pr-.5)/.04,0,1));
    ball.style.transform='translate('+(bx-r-rec)+'px,'+(by-r)+'px) scale('+(1+sq)+','+(1-sq)+') rotate('+rot+'deg)';

    /* dominoes chain */
    var c=clamp((pr-.5)/.22,0,1)*((N-1)*.5+1.1);
    var ex=eio(clamp((pr-.78)/.1,0,1)),fq=clamp((pr-.86)/.12,0,1);
    ball.style.opacity=1-clamp(ex*3,0,1);
    fl.style.opacity=1-ex;rps.forEach(function(e){e.style.opacity=1-ex});
    ticked=false;var fs=Math.min(g.tH*.72,g.tw*1.05);
    dms.forEach(function(d,i){
      var tI=clamp((c-i*.5)/1.1,0,1),thf=i<N-1?72:88,th=thf*tI*tI,rad=th*.0174533;
      if(tI>.04)fire('d'+i,function(){tock(i)});
      if(tI>=.97)fire('e'+i,function(){tock2(i)});
      var w=g.w,h=g.h,px=g.x0+i*g.sp+w,vx=-w/2,vy=-h/2;
      var cx=px+vx*Math.cos(rad)-vy*Math.sin(rad),cy=g.yf+vx*Math.sin(rad)+vy*Math.cos(rad);
      cx=lerp(cx,(i+.5)*g.tw,ex);cy=lerp(cy,g.H/2,ex);
      w=lerp(w,g.tw*.94,ex);h=lerp(h,g.tH,ex);
      /* letters react to the pointer once settled */
      var tk=0,tl=0;
      if(!reduce&&fq>=1){var ddx=tx-(rs.left+cx),ddy=ty-(rs.top+cy),kk=clamp(1-Math.hypot(ddx,ddy)/(g.tw*2.2),0,1);tk=kk;tl=clamp(ddx/g.tw,-1,1)*kk*10}
      d.k=lerp(d.k,tk,.18);d.t=lerp(d.t,tl,.18);
      cy-=d.k*g.tH*.08;
      d.el.style.width=w+'px';d.el.style.height=h+'px';
      d.el.style.transform='translate('+(cx-w/2)+'px,'+(cy-h/2)+'px) rotate('+(th*(1-ex)+d.t)+'deg) scale('+(1+d.k*.1)+')';
      d.pp.style.opacity=1-ex;
      /* letters: A B C … then flip to ERROR 404 */
      var tg=TXT.charAt(i),end=tg===' '?-1:SEQ.indexOf(tg),qf=clamp(fq*1.6-i*.075,0,1);
      var e0=end<0?i+L:(end<i?end+L:end);e0+=L;
      var idx=i+(e0-i)*eo(qf),ch=qf>=1?(tg===' '?'':tg):SEQ.charAt(Math.floor(idx)%L);
      if(ex>0.01){
        d.ch.style.fontSize=fs+'px';d.ch.style.opacity=clamp((ex-.5)*2,0,1);
        d.ch.style.transform='scaleY('+(qf>0&&qf<1?1-.14*Math.sin(Math.PI*(idx%1)):1)+')';
        if(d.cur!==ch){d.ch.textContent=ch;d.cur=ch;if(qf>0&&qf<1)ticked=true}
      }else if(d.cur!==''){d.ch.style.opacity=0;d.ch.textContent='';d.cur=''}
    });
    if(ticked&&now-lastTick>45&&!quiet){lastTick=now;flap()}
    if(ex>.02)fire('whoosh',whoosh);
    if(fq>=1){fire('fin',fin);if(!fired.fb&&vis&&!reduce){fired.fb=1;for(var m=0;m<N;m++)burst((m+.5)*g.tw,g.H/2-g.tH*.5,3,COLS[m%4])}}
    var sh=(!reduce&&pr>.5&&pr<.76)?1:0;
    stg.style.transform='translate('+(Math.sin(now/37)*2.2*sh)+'px,'+(Math.cos(now/43)*1.8*sh)+'px)';
    $('#hint').style.opacity=clamp((pr-.98)*50,0,1);
  }
  /* click / tap / Enter on the story replays it */
  function replay(){st0=performance.now()+300;fired={};cyc=0;dms.forEach(function(d){d.cur=''})}
  story.addEventListener('click',replay);
  story.tabIndex=0;story.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();replay()}});

  /* ---------- scrub words + marquee ---------- */
  var sp=$('#sp'),words=sp.textContent.split(' ');
  sp.innerHTML=words.map(function(w){return '<span class="w">'+w+'</span>'}).join(' ');
  var ws=[].slice.call(sp.querySelectorAll('.w')),wt=[];
  function measure(){wt=ws.map(function(w){return w.getBoundingClientRect().top+scrollY})}
  var t='<span>Page not found</span><span class="f">404</span>';
  ['r1','r2'].forEach(function(id){document.getElementById(id).innerHTML=new Array(7).join(t)});
  var r1=$('#r1'),r2=$('#r2'),x1=0,x2=0,bar=$('#bar'),lastY=scrollY,vel=0,w1=1;
  function measureRow(){w1=r1.scrollWidth/6*2||1}
  var rz;addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){layout();measure();measureRow()},120)});
  addEventListener('load',function(){measure();measureRow()});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){measure();measureRow()});
  measure();measureRow();

  /* ---------- lamp: pull the chain → 404 chaos ---------- */
  (function(){
    var ov=$('#chaos'),pops=$('#pops'),stop=$('#stopc'),hd=$('#pg'),ln=$('#chain'),svg=$('#lamp');
    var PAIRS=[['#FF5A1F','#10163F'],['#2D3DFF','#FFE14D'],['#10163F','#FF5A1F'],['#10163F','#FFE14D']];
    var isOn=false,pull=0,drag=false,sy0=0,moved=0,pi=-1,rows=[],bn=[],sw=[],raf=0,lastC=0,jt=0;
    function recolor(){
      var n;do{n=Math.floor(Math.random()*PAIRS.length)}while(n===pi);pi=n;
      ov.style.setProperty('--b',PAIRS[n][0]);ov.style.setProperty('--k',PAIRS[n][1]);
      tone(90+Math.random()*120,.08,'sawtooth',.07,.5);
    }
    var DIRS=[[0,1],[0,-1],[45,1],[-45,1],[45,-1],[-45,-1],[25,1],[-25,-1]];
    function buildSw(W,H){
      var diag=Math.hypot(W,H),span=Math.max(W,H)*.9,i;
      var order=DIRS.map(function(d,k){return k}).sort(function(){return Math.random()-.5});
      for(i=0;i<DIRS.length;i++){
        var d=DIRS[order[i]],e=document.createElement('div'),txt='<span>This page doesn’t exist.</span>';
        e.className='swp';e.style.fontSize=(30+Math.random()*40)+'px';e.innerHTML=txt;pops.appendChild(e);
        var wc=e.firstChild.offsetWidth||400,n=Math.ceil((diag+2*wc)/wc)+1;
        e.innerHTML=new Array(n+1).join(txt);e.style.marginTop=(-e.offsetHeight/2)+'px';
        sw.push({e:e,a:d[0],ws:n*wc,wc:wc,off:-Math.random()*wc,v:d[1]*(8+Math.random()*12),p:((i+.5)/DIRS.length-.5)*span,cx:W/2,cy:H/2});
      }
    }
    function build(){
      pops.textContent='';rows=[];bn=[];sw=[];
      var H=innerHeight,W=innerWidth,rh=clamp(H/9,64,140),n=Math.ceil(H/rh)+2,i,e;
      for(i=0;i<n;i++){
        e=document.createElement('div');
        e.className='crow'+(i%3===1?' o':'');e.style.top=(i*rh)+'px';e.style.fontSize=(rh*(i%2?.8:.95))+'px';
        e.innerHTML=new Array(14).join('<span>'+(i%2?'This page doesn’t exist.':'ERROR 404')+'</span>');
        pops.appendChild(e);
        rows.push({e:e,x:0,w:0,v:(i%2?-1:1)*(6+Math.random()*14)});
      }
      rows.forEach(function(r){r.w=r.e.scrollWidth/13||600;r.x=-Math.random()*r.w});
      buildSw(W,H);
      for(i=0;i<7;i++){
        e=document.createElement('div');e.className='bnc';e.textContent='ERROR 404';
        e.style.fontSize=(40+Math.random()*80)+'px';pops.appendChild(e);
        var a=Math.random()*6.28,v=5+Math.random()*7;
        bn.push({e:e,x:Math.random()*W*.8,y:Math.random()*H*.8,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:e.offsetWidth,h:e.offsetHeight});
      }
    }
    function tick(now){
      if(!isOn)return;raf=requestAnimationFrame(tick);
      if(now-lastC>(reduce?1500:150)){lastC=now;recolor()}
      var j=reduce?0:1,sp=reduce?.15:3.5,W=innerWidth+140,H=innerHeight+140;
      function rr(m){return (Math.random()-.5)*m*j}
      pops.style.transform='translate('+rr(56)+'px,'+rr(40)+'px) rotate('+rr(2.4)+'deg) skew('+rr(16)+'deg,'+rr(6)+'deg) scale('+(1+j*Math.random()*.07)+')';
      rows.forEach(function(r){r.x+=r.v*sp;if(r.x>0)r.x-=r.w;if(r.x<-r.w)r.x+=r.w;r.e.style.transform='translate('+r.x+'px,'+rr(16)+'px)'});
      sw.forEach(function(q){
        q.off+=q.v*sp;if(q.off>0)q.off-=q.wc;if(q.off<-q.wc)q.off+=q.wc;
        q.e.style.transform='translate('+q.cx+'px,'+q.cy+'px) rotate('+q.a+'deg) translate('+(-q.ws/2+q.off+rr(30))+'px,'+(q.p+rr(24))+'px)';
      });
      bn.forEach(function(b){
        b.x+=b.vx*sp;b.y+=b.vy*sp;
        if(b.x<0||b.x>W-b.w){b.vx*=-1;b.x=clamp(b.x,0,Math.max(0,W-b.w))}
        if(b.y<0||b.y>H-b.h){b.vy*=-1;b.y=clamp(b.y,0,Math.max(0,H-b.h))}
        b.e.style.transform='translate('+b.x+'px,'+b.y+'px) rotate('+rr(20)+'deg) scale('+(1+j*Math.random()*.15)+')';
      });
    }
    function start(){
      isOn=true;ov.classList.add('on');document.body.style.overflow='hidden';
      recolor();build();lastC=performance.now();raf=requestAnimationFrame(tick);
      stop.focus({preventScroll:true});
    }
    function end(){
      isOn=false;cancelAnimationFrame(raf);ov.classList.remove('on');document.body.style.overflow='';
      pops.textContent='';pops.style.transform='';svg.classList.remove('lit');
      hd.focus({preventScroll:true});
    }
    addEventListener('resize',function(){if(isOn)build()});
    function toggle(){
      click(1800,.04,.6);
      if(isOn){end();return}
      svg.classList.add('lit');setTimeout(start,200);
    }
    function setPull(v){pull=v;ln.setAttribute('y2',196+v);hd.setAttribute('transform','translate(0,'+v+')')}
    function spring(){if(drag)return;setPull(pull*.78);if(pull>.3)requestAnimationFrame(spring);else setPull(0)}
    svg.addEventListener('touchmove',function(ev){if(drag)ev.preventDefault()},{passive:false});
    hd.addEventListener('pointerdown',function(ev){drag=true;sy0=ev.clientY;moved=0;ev.preventDefault();try{hd.setPointerCapture(ev.pointerId)}catch(e){}});
    addEventListener('pointermove',function(ev){
      if(!drag)return;var sc=svg.getBoundingClientRect().height/260||1;
      moved=Math.max(moved,Math.abs(ev.clientY-sy0));setPull(clamp((ev.clientY-sy0)/sc,0,44));
    });
    function release(){
      if(!drag)return;drag=false;var go=pull>=18||moved<5;
      if(moved<5)setPull(26);spring();if(go)toggle();
    }
    addEventListener('pointerup',release);
    addEventListener('pointercancel',function(){drag=false;spring()});
    hd.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setPull(30);spring();toggle()}});
    stop.addEventListener('click',end);
    addEventListener('keydown',function(ev){if(ev.key==='Escape'&&isOn)end()});
  })();

  /* ---------- cursor ---------- */
  var cur=$('#cur'),kx=0,ky=0,ks=1;

  /* ---------- one loop for everything ---------- */
  function frame(now){
    requestAnimationFrame(frame);
    if(document.hidden){lastF=now;return}
    var y=scrollY,H=innerHeight,max=document.documentElement.scrollHeight-H;
    vel+=((y-lastY)-vel)*.2;lastY=y;
    bar.style.transform='scaleX('+(max>0?y/max:0)+')';
    story_(H,now);
    for(var i=0;i<ws.length;i++)ws[i].style.opacity=clamp((H*.78-(wt[i]-y))/(H*.25),.2,1);
    if(!reduce){
      var sp2=.7+Math.abs(vel)*.35,sk=clamp(-vel*.6,-12,12);
      x1-=sp2;x2+=sp2;
      if(x1<-w1)x1+=w1;if(x2>0)x2-=w1;
      r1.style.transform='translateX('+x1+'px) skewX('+sk+'deg)';
      r2.style.transform='translateX('+(x2-w1)+'px) skewX('+sk+'deg)';
      stepSparks();
    }
    kx+=(tx-kx)*.18;ky+=(ty-ky)*.18;ks+=((hover?2.4:1)-ks)*.2;
    cur.style.transform='translate('+kx+'px,'+ky+'px) scale('+ks+')';
  }
  requestAnimationFrame(frame);
})();
</script>
